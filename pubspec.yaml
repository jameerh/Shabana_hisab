name: snaphisaab
description: "Shabana Hisaab - Voice-First Expense Manager for Merchants"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  cupertino_icons: ^1.0.2
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.8.3
  archive: ^3.6.1
  pdf: ^3.12.0
  share_plus: ^12.0.2
  printing: ^5.14.3
  flutter_animate: ^4.5.2
  speech_to_text: ^7.3.0
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  gal: ^2.3.2
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  file_picker: ^11.0.2
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.1.2
  math_expressions: ^3.1.0
  table_calendar: ^3.2.0
  qr_flutter: ^4.1.0
  cryptography: ^2.9.0
  device_info_plus: ^12.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/models/vosk-model.zip
    - assets/shabana Hisab App.png
    - assets/shabana_multi_service_ad.png
    - assets/shabana_final_fix_logo.png

dependency_overrides:
  permission_handler: ^12.0.1
  permission_handler_android: ^13.0.1
